<div class="h-screen w-full flex items-center justify-center bg-[var(--background-color)]">
  <div class="glass-panel p-10 w-full max-w-md flex flex-col gap-6">
    <div class="text-center">
      <div class="w-16 h-16 rounded-2xl bg-blue-600 flex items-center justify-center shadow-lg shadow-blue-500/50 mx-auto mb-4">
        <i class="pi pi-bolt text-white text-3xl"></i>
      </div>
      <h1 class="text-3xl font-bold text-dynamic tracking-tight">Vortex<span class="text-blue-400">Admin</span></h1>
      <p class="text-dynamic-muted mt-2">{{ settingsStore.language() === 'pt' ? 'Acesse sua conta' : 'Sign in to your account' }}</p>
    </div>

    <div class="flex flex-col gap-4 mt-4">
      <div class="flex flex-col gap-2">
        <label class="text-sm font-medium text-dynamic-muted">{{ settingsStore.language() === 'pt' ? 'Endereço de Email' : 'Email Address' }}</label>
        <input pInputText type="email" [(ngModel)]="email" class="w-full bg-dynamic border-dynamic text-dynamic p-3 rounded-xl focus:ring-blue-500" placeholder="admin@vortex.com" />
      </div>
      <div class="flex flex-col gap-2">
        <div class="flex items-center justify-between">
          <label class="text-sm font-medium text-dynamic-muted">{{ settingsStore.language() === 'pt' ? 'Senha' : 'Password' }}</label>
          <a href="#" class="text-xs text-blue-400 hover:text-blue-300">{{ settingsStore.language() === 'pt' ? 'Esqueceu a senha?' : 'Forgot password?' }}</a>
        </div>
        <input pInputText type="password" [(ngModel)]="password" class="w-full bg-dynamic border-dynamic text-dynamic p-3 rounded-xl focus:ring-blue-500" placeholder="••••••••" />
      </div>
    </div>

    <button pButton [label]="settingsStore.language() === 'pt' ? 'Entrar' : 'Sign In'" icon="pi pi-sign-in" 
            [loading]="authStore.isLoading()" 
            (click)="onLogin()"
            class="w-full p-button-lg mt-4 bg-blue-600 border-none hover:bg-blue-500 shadow-lg shadow-blue-500/30 rounded-xl flex justify-center text-white">
    </button>
  </div>
</div>
